[package]
name = "sofa"
version = "2.2.1"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Sofa, native: a controller-first home screen that turns a Windows gaming PC into a console"
license = "MIT"

[[bin]]
name = "sofa"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
vdf = { path = "../crates/vdf" }
steam = { path = "../crates/steam" }
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Media",
  "Win32_Globalization",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_UI_Accessibility",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Foundation",
  "Media",
  "Media_Control",
  "Storage",
  "Storage_Streams",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_System_Pipes",
]

[lints.clippy]
all = { level = "warn", priority = -1 }
